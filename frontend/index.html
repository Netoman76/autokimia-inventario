
<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuración de la página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título de la pestaña del navegador -->
    <title>Inventario Autokimia</title>

    <!-- Archivo con los estilos de nuestra página -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ENCABEZADO DE LA APLICACIÓN -->
    <header>
        <h1>Inventario Autokimia</h1>
        <p>Sistema de administración de productos</p>
    </header>

    <main>

        <!-- SECCIÓN DE INICIO DE SESIÓN -->
        <section id="seccionLogin">

            <h2>Iniciar sesión</h2>

            <form id="formLogin">

                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>

                <button type="submit">Ingresar</button>

            </form>

            <p id="mensajeLogin" role="status"></p>

        </section>

        <!-- SECCIÓN DEL INVENTARIO -->
        <section id="seccionInventario" hidden>

            <h2>Productos registrados</h2>

            <!-- Tabla donde mostraremos los productos -->
            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Cantidad</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="listaProductos">
                    <!-- JavaScript agregará los productos aquí -->
                </tbody>

            </table>

            <!-- FORMULARIO PARA AGREGAR Y EDITAR PRODUCTOS -->
            <h2>Administrar producto</h2>

            <form id="formProducto">

                <input type="hidden" id="productoId">

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>

                <label for="descripcion">Descripción:</label>
                <input type="text" id="descripcion">

                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" min="0" step="1" required>

                <label for="precio">Precio:</label>
                <input type="number" id="precio" min="0" step="0.01" required>

                <button type="submit">Guardar producto</button>
                <button type="button" id="btnCancelar">Cancelar edición</button>

            </form>

            <p id="mensajeProducto" role="status"></p>

            <button type="button" id="btnSalir">Cerrar sesión</button>

        </section>

    </main>

    <!-- Archivo con las funciones JavaScript -->
    <script src="script.js" defer></script>

</body>
</html>
